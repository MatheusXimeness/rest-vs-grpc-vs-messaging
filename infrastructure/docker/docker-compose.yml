# Recursos fixos por contêiner (variável de controle do experimento).
# Os mesmos valores devem ser usados no ambiente em nuvem.
x-recursos-servico: &recursos-servico
  cpus: "${CPUS_SERVICO:-1.0}"
  mem_limit: "${MEM_SERVICO:-512m}"

x-recursos-banco: &recursos-banco
  cpus: "${CPUS_BANCO:-0.5}"
  mem_limit: "${MEM_BANCO:-256m}"

x-recursos-broker: &recursos-broker
  cpus: "${CPUS_BROKER:-1.0}"
  mem_limit: "${MEM_BROKER:-512m}"

services:
  db_usuario:
    image: postgres:16-alpine
    <<: *recursos-banco
    environment:
      POSTGRES_USER: usuario
      POSTGRES_PASSWORD: usuario
      POSTGRES_DB: usuario
    ports:
      - "5435:5432"
    volumes:
      - usuario_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U usuario"]
      interval: 5s
      timeout: 5s
      retries: 5

  usuario:
    <<: *recursos-servico
    build:
      context: ../../services/usuario
      dockerfile: Dockerfile
      additional_contexts:
        proto: ../../communication/grpc/proto
    ports:
      - "8001:8001"
    environment:
      COMMUNICATION_STRATEGY: "${ESTRATEGIA:-rest}"
      DATABASE_URL: postgresql+asyncpg://usuario:usuario@db_usuario:5432/usuario
    depends_on:
      db_usuario:
        condition: service_healthy
    restart: on-failure

  db_pedidos:
    image: postgres:16-alpine
    <<: *recursos-banco
    environment:
      POSTGRES_USER: pedidos
      POSTGRES_PASSWORD: pedidos
      POSTGRES_DB: pedidos
    ports:
      - "5432:5432"
    volumes:
      - pedidos_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pedidos"]
      interval: 5s
      timeout: 5s
      retries: 5

  db_estoque:
    image: postgres:16-alpine
    <<: *recursos-banco
    environment:
      POSTGRES_USER: estoque
      POSTGRES_PASSWORD: estoque
      POSTGRES_DB: estoque
    ports:
      - "5433:5432"
    volumes:
      - estoque_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U estoque"]
      interval: 5s
      timeout: 5s
      retries: 5

  estoque:
    <<: *recursos-servico
    build:
      context: ../../services/estoque
      dockerfile: Dockerfile
      additional_contexts:
        proto: ../../communication/grpc/proto
    ports:
      - "8003:8003"
    environment:
      COMMUNICATION_STRATEGY: "${ESTRATEGIA:-rest}"
      INITIAL_STOCK_QUANTITY: "${ESTOQUE_INICIAL:-10000000}"
      DATABASE_URL: postgresql+asyncpg://estoque:estoque@db_estoque:5432/estoque
    depends_on:
      db_estoque:
        condition: service_healthy
    restart: on-failure

  db_pagamento:
    image: postgres:16-alpine
    <<: *recursos-banco
    environment:
      POSTGRES_USER: pagamento
      POSTGRES_PASSWORD: pagamento
      POSTGRES_DB: pagamento
    ports:
      - "5434:5432"
    volumes:
      - pagamento_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pagamento"]
      interval: 5s
      timeout: 5s
      retries: 5

  pagamento:
    <<: *recursos-servico
    build:
      context: ../../services/pagamento
      dockerfile: Dockerfile
      additional_contexts:
        proto: ../../communication/grpc/proto
    ports:
      - "8002:8002"
    environment:
      COMMUNICATION_STRATEGY: "${ESTRATEGIA:-rest}"
      RANDOM_SEED: "${SEMENTE:-42}"
      DATABASE_URL: postgresql+asyncpg://pagamento:pagamento@db_pagamento:5432/pagamento
    depends_on:
      db_pagamento:
        condition: service_healthy
    restart: on-failure

  pedidos:
    <<: *recursos-servico
    build:
      context: ../../services/pedidos
      dockerfile: Dockerfile
      additional_contexts:
        proto: ../../communication/grpc/proto
    ports:
      - "8000:8000"
    environment:
      COMMUNICATION_STRATEGY: "${ESTRATEGIA:-rest}"
      DATABASE_URL: postgresql+asyncpg://pedidos:pedidos@db_pedidos:5432/pedidos
      USE_STUB_SERVICES: "false"
      USE_STUB_STOCK: "false"
      USE_STUB_PAYMENT: "false"
      USUARIO_SERVICE_URL: "http://usuario:8001"
      ESTOQUE_SERVICE_URL: "http://estoque:8003"
      PAGAMENTO_SERVICE_URL: "http://pagamento:8002"
    depends_on:
      db_pedidos:
        condition: service_healthy
      usuario:
        condition: service_started
      estoque:
        condition: service_started
      pagamento:
        condition: service_started
    restart: on-failure

  # Broker da estratégia de mensageria. Só sobe com o perfil "mensageria", que o
  # executor dos testes ativa quando -e mensageria; nas outras estratégias não consome
  # recursos. Os serviços tentam conectar por até 60 s enquanto ele inicializa.
  rabbitmq:
    image: rabbitmq:3.13-alpine
    profiles: ["mensageria"]
    <<: *recursos-broker
    ports:
      - "5672:5672"
    volumes:
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/conf.d/20-tcc.conf:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

  collector:
    build:
      context: ../../analysis
      dockerfile: Dockerfile
    environment:
      USUARIO_URL: "http://usuario:8001"
      PEDIDOS_URL: "http://pedidos:8000"
      PAGAMENTO_URL: "http://pagamento:8002"
      ESTOQUE_URL: "http://estoque:8003"
      TIPO: "${ESTRATEGIA:-rest}"
      AMBIENTE: "${AMBIENTE:-local}"
      CENARIO: "funcional"
      COLETA_AUTOMATICA: "${COLETA_AUTOMATICA:-true}"
      INTERVALO_COLETA: "10"
      INTERVALO_LOOP: "300"
    volumes:
      - ../../metricas:/app/metricas
    depends_on:
      - usuario
      - pedidos
      - pagamento
      - estoque

  # Gerador de carga — só sobe sob demanda (perfil "carga"), via load-tests/k6/executar.sh
  k6:
    image: grafana/k6:0.54.0
    profiles: ["carga"]
    cpus: "${CPUS_K6:-2.0}"
    mem_limit: "${MEM_K6:-1g}"
    environment:
      BASE_URL: "http://pedidos:8000"
    volumes:
      - ../../load-tests/k6:/scripts:ro
      - ../../metricas:/metricas
    depends_on:
      - pedidos

volumes:
  usuario_db:
  pedidos_db:
  estoque_db:
  pagamento_db:
