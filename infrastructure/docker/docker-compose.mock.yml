services:
  usuario:
    build:
      context: ../../services/usuario
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    environment:
      USE_IN_MEMORY_DB: "true"

  estoque:
    build:
      context: ../../services/estoque
      dockerfile: Dockerfile
    ports:
      - "8003:8003"
    environment:
      USE_IN_MEMORY_DB: "true"

  pagamento:
    build:
      context: ../../services/pagamento
      dockerfile: Dockerfile
    ports:
      - "8002:8002"
    environment:
      USE_IN_MEMORY_DB: "true"

  pedidos:
    build:
      context: ../../services/pedidos
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      USE_IN_MEMORY_DB: "true"
      USE_STUB_SERVICES: "false"
      USE_STUB_STOCK: "false"
      USE_STUB_PAYMENT: "false"
      USUARIO_SERVICE_URL: "http://usuario:8001"
      ESTOQUE_SERVICE_URL: "http://estoque:8003"
      PAGAMENTO_SERVICE_URL: "http://pagamento:8002"
    depends_on:
      - usuario
      - estoque
      - pagamento

  collector:
    build:
      context: ../../analysis
      dockerfile: Dockerfile
    environment:
      USUARIO_URL: "http://usuario:8001"
      PEDIDOS_URL: "http://pedidos:8000"
      PAGAMENTO_URL: "http://pagamento:8002"
      ESTOQUE_URL: "http://estoque:8003"
      TIPO: "rest"
      AMBIENTE: "local"
      CENARIO: "funcional"
      INTERVALO_COLETA: "10"   # segundos entre as duas coletas para calcular rates
      INTERVALO_LOOP: "300"    # segundos entre cada rodada de coleta
    volumes:
      - ../../metricas:/app/metricas
    depends_on:
      - usuario
      - pedidos
      - pagamento
      - estoque
