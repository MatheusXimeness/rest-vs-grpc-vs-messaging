# Recursos fixos por contêiner (variável de controle do experimento).
# Os mesmos valores devem ser usados no ambiente em nuvem.
x-recursos-servico: &recursos-servico
  cpus: "${CPUS_SERVICO:-1.0}"
  mem_limit: "${MEM_SERVICO:-512m}"

x-recursos-banco: &recursos-banco
  cpus: "${CPUS_BANCO:-0.5}"
  mem_limit: "${MEM_BANCO:-256m}"

services:
  usuario:
    <<: *recursos-servico
    build:
      context: ../../services/usuario
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    environment:
      USE_IN_MEMORY_DB: "true"

  estoque:
    <<: *recursos-servico
    build:
      context: ../../services/estoque
      dockerfile: Dockerfile
    ports:
      - "8003:8003"
    environment:
      INITIAL_STOCK_QUANTITY: "${ESTOQUE_INICIAL:-10000000}"
      USE_IN_MEMORY_DB: "true"

  pagamento:
    <<: *recursos-servico
    build:
      context: ../../services/pagamento
      dockerfile: Dockerfile
    ports:
      - "8002:8002"
    environment:
      RANDOM_SEED: "${SEMENTE:-42}"
      USE_IN_MEMORY_DB: "true"

  pedidos:
    <<: *recursos-servico
    build:
      context: ../../services/pedidos
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      USE_IN_MEMORY_DB: "true"
      USE_STUB_SERVICES: "false"
      USE_STUB_STOCK: "false"
      USE_STUB_PAYMENT: "false"
      USUARIO_SERVICE_URL: "http://usuario:8001"
      ESTOQUE_SERVICE_URL: "http://estoque:8003"
      PAGAMENTO_SERVICE_URL: "http://pagamento:8002"
    depends_on:
      - usuario
      - estoque
      - pagamento

  collector:
    build:
      context: ../../analysis
      dockerfile: Dockerfile
    environment:
      USUARIO_URL: "http://usuario:8001"
      PEDIDOS_URL: "http://pedidos:8000"
      PAGAMENTO_URL: "http://pagamento:8002"
      ESTOQUE_URL: "http://estoque:8003"
      TIPO: "${ESTRATEGIA:-rest}"
      AMBIENTE: "${AMBIENTE:-local}"
      CENARIO: "funcional"
      COLETA_AUTOMATICA: "${COLETA_AUTOMATICA:-true}"
      INTERVALO_COLETA: "10"   # segundos entre as duas coletas para calcular rates
      INTERVALO_LOOP: "300"    # segundos entre cada rodada de coleta
    volumes:
      - ../../metricas:/app/metricas
    depends_on:
      - usuario
      - pedidos
      - pagamento
      - estoque

  # Gerador de carga — só sobe sob demanda (perfil "carga"), via load-tests/k6/executar.sh
  k6:
    image: grafana/k6:0.54.0
    profiles: ["carga"]
    cpus: "${CPUS_K6:-2.0}"
    mem_limit: "${MEM_K6:-1g}"
    environment:
      BASE_URL: "http://pedidos:8000"
    volumes:
      - ../../load-tests/k6:/scripts:ro
      - ../../metricas:/metricas
    depends_on:
      - pedidos
