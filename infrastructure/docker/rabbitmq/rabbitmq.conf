# Configuração do broker da estratégia de mensageria.
# O limite de memória precisa ficar abaixo do mem_limit do contêiner (512m no compose):
# o RabbitMQ não enxerga o limite do cgroup e, por padrão, usaria 40% da RAM do host.
vm_memory_high_watermark.absolute = 384MiB
disk_free_limit.absolute = 256MiB

# Sem plugin de gerenciamento e sem estatísticas detalhadas, para reduzir o overhead.
collect_statistics = none

loopback_users = none
